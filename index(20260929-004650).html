<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>校舎マップ 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  color-scheme: light dark;
  --bg:#e5eaef;
  --panel:rgba(250,252,253,.88);
  --panel-line:rgba(24,36,48,.13);
  --ink:#17222d;
  --ink-soft:#54636f;
  --accent:#1c5fd1;
  --accent-ink:#ffffff;
  --slab-lo:#a9b9c7;
  --slab-hi:#d3dde5;
  --wall-lo:#e4eaef;
  --wall-hi:#fbfcfd;
  --edge:#566779;
  --grid:#c1cbd4;
  --tread:#6a7c8d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171c;
    --panel:rgba(26,33,40,.88);
    --panel-line:rgba(220,232,244,.14);
    --ink:#e7eef5;
    --ink-soft:#9aa9b7;
    --accent:#5b9bff;
    --accent-ink:#0c1218;
    --slab-lo:#2b3743;
    --slab-hi:#465666;
    --wall-lo:#6d7f90;
    --wall-hi:#a9b8c6;
    --edge:#1b232b;
    --grid:#232d36;
    --tread:#90a1b1;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c;
  --panel:rgba(26,33,40,.88);
  --panel-line:rgba(220,232,244,.14);
  --ink:#e7eef5;
  --ink-soft:#9aa9b7;
  --accent:#5b9bff;
  --accent-ink:#0c1218;
  --slab-lo:#2b3743;
  --slab-hi:#465666;
  --wall-lo:#6d7f90;
  --wall-hi:#a9b8c6;
  --edge:#1b232b;
  --grid:#232d36;
  --tread:#90a1b1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{
  margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;
}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{
  background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.title{position:absolute;left:12px;top:12px;max-width:min(300px,calc(100% - 24px));padding:10px 14px 10px}
.title h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.title p{margin:2px 0 0;color:var(--ink-soft);font-size:12px}
.title details{margin-top:8px;font-size:12px}
.title summary{cursor:pointer;color:var(--ink-soft);list-style:none;padding:2px 0}
.title summary::-webkit-details-marker{display:none}
.title summary::before{content:"＋ ";}
.title details[open] summary::before{content:"－ ";}
.legend{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.rail{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;padding:6px;
}
.rail button{
  width:48px;height:40px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;
}
.rail button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.rail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail .sep{height:1px;background:var(--panel-line);margin:2px 6px}

.dock{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  width:min(760px,calc(100% - 24px));padding:10px 12px;display:grid;gap:10px;
}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.chip{
  border:1px solid var(--panel-line);background:transparent;border-radius:8px;padding:5px 11px;min-height:32px;
}
.seg button:hover,.chip:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[disabled]{opacity:.4;cursor:default}
.sliders{display:flex;flex-wrap:wrap;gap:6px 18px;flex:1 1 300px}
.sliders label{display:flex;align-items:center;gap:8px;flex:1 1 200px;color:var(--ink-soft);font-size:12px;white-space:nowrap}
.sliders input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
.msg{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink-soft)
}
@media (max-width:640px){
  .title p{display:none}
  .rail button{width:42px;height:36px}
  .dock{padding:8px 10px;gap:8px}
}
@media (max-height:560px){
  .title details{display:none}
  .rail button{height:32px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage" aria-label="校舎の3Dマップ。ドラッグで回転できます"></div>
<div id="msg" class="msg" role="alert"></div>

<header class="title panel">
  <h1>校舎マップ 3D</h1>
  <p>ドラッグで回転、ホイールで拡大、右ドラッグで移動</p>
  <details id="legend">
    <summary>凡例</summary>
    <ul class="legend">
      <li><span class="dot" style="background:#0b8f0b"></span>1年生　<span class="dot" style="background:#d81f1f"></span>2年生　<span class="dot" style="background:#0a86b3"></span>3年生</li>
      <li>L○-○ 普通科　T○-○ 工業技術科</li>
      <li>▲ 階段（行き先の階）　🚻 トイレ</li>
      <li style="margin-top:4px">文化祭の配置図（色は推定）：</li>
      <li><span class="dot" style="background:#ff0000"></span>立入禁止　<span class="dot" style="background:#ff5fc0"></span>部活の出し物</li>
      <li><span class="dot" style="background:#00aaff"></span>青の教室　<span class="dot" style="background:#ffd400"></span>黄の教室</li>
      <li>✕ 立入禁止の表示</li>
    </ul>
  </details>
</header>

<nav class="rail panel" id="rail" aria-label="階の選択">
  <button type="button" data-floor="all" aria-pressed="true">全階</button>
  <div class="sep"></div>
  <button type="button" data-floor="5" aria-pressed="false">5F</button>
  <button type="button" data-floor="4" aria-pressed="false">4F</button>
  <button type="button" data-floor="3" aria-pressed="false">3F</button>
  <button type="button" data-floor="2" aria-pressed="false">2F</button>
  <button type="button" data-floor="1" aria-pressed="false">1F</button>
</nav>

<section class="dock panel" aria-label="表示の操作">
  <div class="row">
    <div class="seg" id="views" role="group" aria-label="視点">
      <button type="button" data-view="iso">斜め</button>
      <button type="button" data-view="top">真上</button>
      <button type="button" data-view="south">南から</button>
      <button type="button" data-view="east">東から</button>
      <button type="button" data-view="north">北から</button>
      <button type="button" data-view="west">西から</button>
    </div>
    <div class="seg">
      <button type="button" class="chip" id="tOnly" aria-pressed="false" disabled>選んだ階だけ</button>
      <button type="button" class="chip" id="tLabels" aria-pressed="true">施設名</button>
      <button type="button" class="chip" id="tStairs" aria-pressed="true">階段</button>
      <button type="button" class="chip" id="tFes" aria-pressed="true">団体名・立入禁止</button>
      <button type="button" class="chip" id="tAuto" aria-pressed="false">自動回転</button>
    </div>
  </div>
  <div class="sliders">
    <label>階の間隔 <input type="range" id="gap" min="0" max="30" step="0.5" value="0" aria-label="階の間隔"></label>
    <label>壁の高さ <input type="range" id="wallH" min="0.5" max="8" step="0.1" value="4.2" aria-label="壁の高さ"></label>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

    var X=[ax+nx,bx+nx,bx-nx,ax-nx], Z=[az+nz,bz+nz,bz-nz,az-nz];
    var V=function(i,y){return [X[i],y,Z[i]];};
    quad(V(0,1),V(1,1),V(2,1),V(3,1));
    for(var i=0;i<4;i++){var j=(i+1)%4; quad(V(i,0),V(j,0),V(j,1),V(i,1));}
  }
  return new Float32Array(pos);
}
function buildSlab(rects,thick){
  var pos=[], y0=0, y1=-thick;
  for(var i=0;i<rects.length;i++){
    var r=rects[i], x0=r[0], z0=r[1], x1=r[2], z1=r[3];
    pos.push(x0,y0,z0, x0,y0,z1, x1,y0,z1,  x0,y0,z0, x1,y0,z1, x1,y0,z0);
    pos.push(x0,y1,z0, x1,y1,z1, x0,y1,z1,  x0,y1,z0, x1,y1,z0, x1,y1,z1);
  }
  return new Float32Array(pos);
}
function buildLines(segs,y){
  var pos=[];
  for(var i=0;i<segs.length;i++){var s=segs[i]; pos.push(s[0],y,s[1],s[2],y,s[3]);}
  return new Float32Array(pos);
}
function toAscii(s){return s.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});}
function buildZoneMesh(zones){
  var pos=[],col=[];
  function hex2rgb(h){var n=parseInt(h.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
  for(var i=0;i<zones.length;i++){
    var z=zones[i], c=hex2rgb(z[0]), x0=z[1],y0=z[2],x1=z[3],y1=z[4], y=0.08;
    var v=[[x0,y,y0],[x1,y,y0],[x1,y,y1],[x0,y,y1]];
    var tri=[v[0],v[1],v[2], v[0],v[2],v[3]];
    for(var k=0;k<6;k++){pos.push(tri[k][0],tri[k][1],tri[k][2]); col.push(c[0],c[1],c[2]);}
  }
  return {pos:new Float32Array(pos),col:new Float32Array(col)};
}
function contrastText(hex){
  var n=parseInt(hex.slice(1),16), r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  var l=(0.299*r+0.587*g+0.114*b)/255;
  return l>0.62?'#1b2732':'#ffffff';
}

if(typeof THREE==='undefined'){
  if(typeof module!=='undefined'){ module.exports={buildWalls:buildWalls,buildSlab:buildSlab,buildLines:buildLines,toAscii:toAscii}; }
  else { var m=document.getElementById('msg'); m.style.display='flex'; m.textContent='3Dライブラリを読み込めませんでした。ネットワークを確認して再読み込みしてください。'; }
  return;
}

/* ---------- scene ---------- */
var stage=document.getElementById('stage');
var renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(e){
  var mm=document.getElementById('msg'); mm.style.display='flex'; mm.textContent='このブラウザでは3D表示（WebGL）を使えません。';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(38,1,1,3000);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.09;
controls.minDistance=25; controls.maxDistance=900;
controls.maxPolarAngle=Math.PI/2-0.02;
controls.autoRotateSpeed=1.2;

scene.add(new THREE.HemisphereLight(0xffffff,0x8896a4,0.78));
var sun=new THREE.DirectionalLight(0xffffff,0.82);
sun.position.set(-140,260,180); scene.add(sun);

var world=new THREE.Group(); scene.add(world);
var gridHelper=null;
var mats={slab:[],wall:[],edge:null,tread:null};
var groups={};

function cssColor(name,fallback){
  var v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return new THREE.Color(v||fallback);
}
function applyTheme(){
  var bg=cssColor('--bg','#e5eaef');
  scene.background=bg;
  var sl=cssColor('--slab-lo','#a9b9c7'), sh=cssColor('--slab-hi','#d3dde5');
  var wl=cssColor('--wall-lo','#e4eaef'), wh=cssColor('--wall-hi','#fbfcfd');
  FLOORS.forEach(function(f,i){
    var k=i/(FLOORS.length-1);
    mats.slab[i].color.copy(sl).lerp(sh,k);
    mats.wall[i].color.copy(wl).lerp(wh,k);
  });
  mats.edge.color.copy(cssColor('--edge','#566779'));
  mats.tread.color.copy(cssColor('--tread','#6a7c8d'));
  if(gridHelper){world.remove(gridHelper); gridHelper.geometry.dispose(); gridHelper.material.dispose();}
  var g=cssColor('--grid','#c1cbd4');
  gridHelper=new THREE.GridHelper(520,52,g,g);
  gridHelper.position.set(CENTER.x,-1.2,CENTER.z);
  world.add(gridHelper);
  needsRender=true;
}

function chipTexture(text,color,fill,strong){
  var c=document.createElement('canvas'), ctx=c.getContext('2d');
  var fs=46, padX=22, h=fs+26;
  ctx.font=(strong?'700 ':'600 ')+fs+'px '+FONT;
  var w=Math.ceil(ctx.measureText(text).width)+padX*2;
  c.width=w; c.height=h;
  ctx.font=(strong?'700 ':'600 ')+fs+'px '+FONT;
  ctx.textBaseline='middle';
  var r=h/2-2;
  ctx.beginPath();
  ctx.moveTo(r+2,2); ctx.lineTo(w-r-2,2); ctx.arc(w-r-2,h/2,r,-Math.PI/2,Math.PI/2);
  ctx.lineTo(r+2,h-2); ctx.arc(r+2,h/2,r,Math.PI/2,Math.PI*1.5); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(20,30,40,.22)'; ctx.stroke();
  ctx.fillStyle=color; ctx.fillText(text,padX,h/2+3);
  var tex=new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false;
  return {tex:tex,ratio:w/h};
}
var INK_MAP={'#00b200':'#0b8f0b','#ff0000':'#d81f1f','#00aad4':'#0a86b3','#008000':'#0b7a0b'};
function labelColor(c){
  c=(c||'').toLowerCase();
  if(INK_MAP[c]) return INK_MAP[c];
  return '#1b2732';
}
function makeSprite(text,color,fill,strong,height){
  var ct=chipTexture(text,color,fill,strong);
  var mat=new THREE.SpriteMaterial({map:ct.tex,transparent:true,depthWrite:false});
  var sp=new THREE.Sprite(mat);
  sp.scale.set(height*ct.ratio,height,1);
  return sp;
}

mats.edge=new THREE.LineBasicMaterial({color:0x566779,transparent:true,opacity:0.85});
mats.tread=new THREE.LineBasicMaterial({color:0x6a7c8d});

FLOORS.forEach(function(f,i){
  var d=DATA.floors[String(f)];
  var g=new THREE.Group();
  var slabMat=new THREE.MeshLambertMaterial({color:0xcccccc});
  var wallMat=new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
  mats.slab.push(slabMat); mats.wall.push(wallMat);

  var slabGeo=new THREE.BufferGeometry();
  slabGeo.setAttribute('position',new THREE.BufferAttribute(buildSlab(d.slab,SLAB_T),3));
  slabGeo.computeVertexNormals();
  g.add(new THREE.Mesh(slabGeo,slabMat));

  var wallGeo=new THREE.BufferGeometry();
  wallGeo.setAttribute('position',new THREE.BufferAttribute(buildWalls(d.walls,WALL_T),3));
  wallGeo.computeVertexNormals();
  var walls=new THREE.Group();
  walls.add(new THREE.Mesh(wallGeo,wallMat));
  walls.add(new THREE.LineSegments(new THREE.EdgesGeometry(wallGeo,25),mats.edge));
  g.add(walls);

  var treadGeo=new THREE.BufferGeometry();
  treadGeo.setAttribute('position',new THREE.BufferAttribute(buildLines(d.treads,0.06),3));
  g.add(new THREE.LineSegments(treadGeo,mats.tread));

  var labels=new THREE.Group();
  d.texts.forEach(function(t){
    var isIcon=/^🚻/.test(t.t);
    var sp=makeSprite(t.t,labelColor(t.c),'rgba(255,255,255,.93)',false,isIcon?2.6:LABEL_H);
    sp.position.set(t.x,0,t.y);
    labels.add(sp);
  });
  g.add(labels);

  var stairs=new THREE.Group();
  d.stairs.forEach(function(s){
    var txt='▲'+(s.l&&s.l.length?' '+s.l.map(toAscii).join(' '):'');
    var sp=makeSprite(txt,'#ffffff','rgba(28,95,209,.94)',true,LABEL_H*0.92);
    sp.position.set(s.x,0,s.y);
    stairs.add(sp);
  });
  g.add(stairs);

  var fes=new THREE.Group();
  if(d.zones && d.zones.length){
    var zb=buildZoneMesh(d.zones);
    var zoneGeo=new THREE.BufferGeometry();
    zoneGeo.setAttribute('position',new THREE.BufferAttribute(zb.pos,3));
    zoneGeo.setAttribute('color',new THREE.BufferAttribute(zb.col,3));
    var zoneMat=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.68,side:THREE.DoubleSide,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    fes.add(new THREE.Mesh(zoneGeo,zoneMat));
  }
  var fesLabels=new THREE.Group();
  (d.zoneLabels||[]).forEach(function(t){
    var sp=makeSprite(t.t,contrastText(t.c),t.c,false,LABEL_H*0.95);
    sp.position.set(t.x,0,t.y);
    fesLabels.add(sp);
  });
  fes.add(fesLabels);
  var barriers=new THREE.Group();
  (d.barriers||[]).forEach(function(b){
    var sp=makeSprite('✕','#ffffff','rgba(220,20,30,.95)',true,LABEL_H*0.85);
    sp.position.set(b.x,0,b.y);
    barriers.add(sp);
  });
  fes.add(barriers);
  g.add(fes);

  g.userData={walls:walls,labels:labels,stairs:stairs,fes:fes,fesLabels:fesLabels,barriers:barriers};
  groups[f]=g; world.add(g);
});

/* ---------- state -> scene ---------- */
var needsRender=true;
function layout(){
  FLOORS.forEach(function(f){
    var g=groups[f];
    g.position.y=(f-1)*(FH+state.gap);
    g.userData.walls.scale.y=state.wallH;
    g.userData.labels.position.y=state.wallH+1.3;
    g.userData.stairs.position.y=state.wallH+1.3;
    g.userData.fesLabels.position.y=state.wallH+1.6;
    g.userData.barriers.position.y=state.wallH+1.3;
  });
  needsRender=true;
}
function topVisible(){
  var top=1;
  FLOORS.forEach(function(f){if(groups[f].visible) top=Math.max(top,f);});
  return top;
}
function applyVisibility(){
  FLOORS.forEach(function(f){
    var vis=true;
    if(state.cur!==null) vis = state.only ? f===state.cur : f<=state.cur;
    var g=groups[f];
    g.visible=vis;
    g.userData.labels.visible=state.labels;
    g.userData.stairs.visible=state.stairs;
    g.userData.fes.visible=state.fes;
  });
  needsRender=true;
}
function targetY(){
  var lo=1;
  if(state.cur!==null && state.only) lo=state.cur;
  var top=topVisible();
  var y0=(lo-1)*(FH+state.gap), y1=(top-1)*(FH+state.gap)+state.wallH;
  return (y0+y1)/2;
}

/* ---------- camera ---------- */
var tween=null;
function sph(){
  var o=camera.position.clone().sub(controls.target), r=o.length();
  return {az:Math.atan2(o.x,o.z), el:Math.asin(o.y/r), r:r};
}
function fitDist(){
  var w=stage.clientWidth||1, h=stage.clientHeight||1;
  var a=w/h;
  return 330*Math.max(1,1.3/a);
}
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function flyTo(az,el,r,ty){
  var s=sph(), t0=controls.target.clone(), t1=new THREE.Vector3(CENTER.x,ty,CENTER.z);
  var da=az-s.az; da=Math.atan2(Math.sin(da),Math.cos(da));
  function apply(k){
    var A=s.az+da*k, E=s.el+(el-s.el)*k, R=s.r+(r-s.r)*k;
    controls.target.lerpVectors(t0,t1,k);
    camera.position.set(
      controls.target.x+R*Math.sin(A)*Math.cos(E),
      controls.target.y+R*Math.sin(E),
      controls.target.z+R*Math.cos(A)*Math.cos(E));
    camera.lookAt(controls.target);
    needsRender=true;
  }
  if(reduceMotion.matches){apply(1);return;}
  var t=performance.now(), ms=650;
  tween=function(now){
    var k=Math.min(1,(now-t)/ms);
    var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    apply(e);
    return k>=1;
  };
}
var VIEWS={
  iso:{az:-0.62,el:0.74,k:1},
  top:{az:0,el:Math.PI/2-0.03,k:0.95},
  south:{az:0,el:0.30,k:1},
  east:{az:Math.PI/2,el:0.30,k:1},
  north:{az:Math.PI,el:0.30,k:1},
  west:{az:-Math.PI/2,el:0.30,k:1}
};
function goView(name){
  var v=VIEWS[name];
  flyTo(v.az,v.el,fitDist()*v.k,targetY());
  document.querySelectorAll('#views button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.view===name));});
}

/* ---------- UI ---------- */
function setFloor(v){
  state.cur = v==='all' ? null : Number(v);
  document.querySelectorAll('#rail button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.floor===String(v)));});
  var only=document.getElementById('tOnly');
  only.disabled = state.cur===null;
  if(state.cur===null){state.only=false; only.setAttribute('aria-pressed','false');}
  applyVisibility();
}
document.querySelectorAll('#rail button').forEach(function(b){
  b.addEventListener('click',function(){setFloor(b.dataset.floor);});
});
document.querySelectorAll('#views button').forEach(function(b){
  b.addEventListener('click',function(){goView(b.dataset.view);});
});
function toggle(id,key,after){
  var el=document.getElementById(id);
  el.addEventListener('click',function(){
    if(el.disabled) return;
    state[key]=!state[key];
    el.setAttribute('aria-pressed',String(state[key]));
    after();
  });
}
toggle('tOnly','only',applyVisibility);
toggle('tLabels','labels',applyVisibility);
toggle('tStairs','stairs',applyVisibility);
toggle('tFes','fes',applyVisibility);
toggle('tAuto','auto',function(){controls.autoRotate=state.auto; needsRender=true;});
document.getElementById('gap').addEventListener('input',function(e){state.gap=Number(e.target.value); layout();});
document.getElementById('wallH').addEventListener('input',function(e){state.wallH=Number(e.target.value); layout();});

if(window.matchMedia('(min-width:720px) and (min-height:600px)').matches){
  document.getElementById('legend').open=true;
}

/* ---------- loop ---------- */
function resize(){
  var w=stage.clientWidth||1, h=stage.clientHeight||1;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  needsRender=true;
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);} else {window.addEventListener('resize',resize);}
controls.addEventListener('change',function(){needsRender=true;});
controls.addEventListener('start',function(){tween=null;});

function loop(now){
  requestAnimationFrame(loop);
  if(tween && tween(now)) tween=null;
  var moved=controls.update();
  if(needsRender||moved||state.auto){
    renderer.render(scene,camera);
    needsRender=false;
  }
}

/* theme changes */
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function themeSoon(){setTimeout(applyTheme,0);}
if(mq.addEventListener) mq.addEventListener('change',themeSoon); else if(mq.addListener) mq.addListener(themeSoon);
try{new MutationObserver(themeSoon).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

/* start */
applyTheme();
layout();
applyVisibility();
resize();
(function(){
  var v=VIEWS.iso, r=fitDist(), ty=targetY();
  controls.target.set(CENTER.x,ty,CENTER.z);
  camera.position.set(
    CENTER.x+r*Math.sin(v.az)*Math.cos(v.el),
    ty+r*Math.sin(v.el),
    CENTER.z+r*Math.cos(v.az)*Math.cos(v.el));
  camera.lookAt(controls.target);
  controls.update();
  document.querySelector('#views button[data-view="iso"]').setAttribute('aria-pressed','true');
})();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
